apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: python-microservice-template
  title: Python Microservice on OpenStack
  description: Creates a standard Python microservice pre-configured for the OpenStack DevPortal
  tags:
    - python
    - openstack
    - scaffolder
spec:
  owner: platform-engineers
  type: service

  parameters:
    - title: Provide component details
      type: object
      required:
        - name
        - description
      properties:
        name:
          title: Component Name
          type: string
          description: Unique name of the service (e.g. billing-service)
          ui:autofocus: true
          ui:options:
            help: Use lowercase letters and hyphens only
        description:
          title: Description
          type: string
          description: Brief description of what this microservice does
        owner:
          title: Owner
          type: string
          default: platform-engineers
          description: The owner team of this component

  steps:
    - id: log-message
      name: Log Template Parameters
      action: debug:log
      input:
        message: 'Creating service ${{ parameters.name }} owned by ${{ parameters.owner }}'

    - id: fetch-base
      name: Fetch Base Skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        allowedHosts: ['github.com']
        description: ${{ parameters.description }}
        repoUrl: 'github.com?repo=${{ parameters.name }}&owner=Abderraoufzekkour'

    - id: register
      name: Register Component to Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
